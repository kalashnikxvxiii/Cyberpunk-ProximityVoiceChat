# VoiceChat: modifica a gioco chiuso.

# Server vocale (indirizzo:porta).
server = @SERVER@
# Chi ha lo stesso codice stanza si sente.
room = @ROOM@
# Vuoto = il tuo nome di NightCoop.
name =
# Party a cui entri all'avvio: i membri dello stesso party si sentono a qualsiasi distanza.
party =
# Push-to-talk: mouse4, mouse5, una lettera (es. V), F1-F12, o un codice VK di Windows (es. 0x14).
ptt = mouse4
# Volume degli altri giocatori e del tuo microfono (1.0 = normale).
volume = 1.0
mic_gain = 1.0
