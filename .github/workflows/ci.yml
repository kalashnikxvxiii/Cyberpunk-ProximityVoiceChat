name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup comes with the runners: no third-party action in the build.
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: tools/fetch-steamaudio.sh
      - run: cargo test --locked
      - run: luajit cet/tests/acoustics_test.lua

  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rustup comes with the runners: no third-party action in the build.
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: tools/fetch-steamaudio.sh
        shell: bash
      - run: cargo build --release --locked -p voice-chat -p vc-server
        env:
          # bindgen uses the runner's libclang, older than what the newest MSVC STL checks for;
          # it only reads the headers, so the version check can be skipped.
          BINDGEN_EXTRA_CLANG_ARGS: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
      - uses: actions/upload-artifact@v4
        with:
          name: voicechat-windows
          path: |
            target/release/VoiceChat.dll
            target/release/vc-server.exe
            third_party/steamaudio/lib/windows-x64/phonon.dll
